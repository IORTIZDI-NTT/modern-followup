name: Build and publish report

on:
  push:
    branches: [main]
    paths:
      - "data/input/**"
      - "src/**"
      - "templates/**"
      - "static/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/publish-report.yml"
  workflow_dispatch:
    inputs:
      month:
        description: "Mes del informe (YYYY-MM); vacío usa el mes actual"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and data
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice for XLSB styles
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Select report month
        id: period
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            REPORT_MONTH="$REQUESTED_MONTH"
          else
            REPORT_MONTH="$(TZ=Europe/Madrid date +%Y-%m)"
          fi
          echo "month=$REPORT_MONTH" >> "$GITHUB_OUTPUT"

      - name: Build HTML report
        run: python -m src.build_report --month "${{ steps.period.outputs.month }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy private Pages site
        id: deployment
        uses: actions/deploy-pages@v4
